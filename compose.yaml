services:
  handyman:
    image: ghcr.io/oligety/handyman:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handyman
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    ports:
      - "${PORT:-4321}:4321"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
